name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Run Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies (LightGBM OpenMP)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python compilation (all source files)
        run: |
          python -m compileall app/ frontend/ tests/ -q

      - name: Run test suite
        run: |
          pytest tests/ -v --tb=short

      - name: Confirm test count
        run: |
          echo "Expected: 17 tests passing (8 API + 9 frontend)"
